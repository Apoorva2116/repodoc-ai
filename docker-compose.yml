services:
  repodoc-ai:
    build: .
    container_name: repodoc-ai
    ports:
      - "8501:8501"
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./logs:/app/logs
      - ./corpus:/app/corpus:ro
    restart: unless-stopped
